spring:
  application:
    name: patient-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patient-management-db}
    username: ${SPRING_DATASOURCE_USERNAME:chis}
    password: ${SPRING_DATASOURCE_PASSWORD:chis}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 4000

billing-service:
  host: ${BILLING_SERVICE_HOST:localhost}
  grpc:
    port: ${BILLING_SERVICE_GRPC_PORT:9001}

logging:
  level:
    root: info
