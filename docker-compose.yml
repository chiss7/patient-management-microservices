services:
  postgres:
    container_name: postgres-patient-management
    image: postgres
    environment:
      POSTGRES_USER: chis
      POSTGRES_PASSWORD: chis
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: patient-management-db
    volumes:
      - postgres:/data/postgres
    ports:
      - 5432:5432
    networks:
      - patient-network
    restart: unless-stopped

  patient-service:
    container_name: patient-service
    image: api-patient-service:latest
    build:
      context: ./patient-service
      dockerfile: Dockerfile
    ports:
      - 4000:4000
    depends_on:
      - postgres
    networks:
      - patient-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-patient-management:5432/patient-management-db
      SPRING_DATASOURCE_USERNAME: chis
      SPRING_DATASOURCE_PASSWORD: chis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
      BILLING_SERVICE_HOST: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
    restart: unless-stopped

  billing-service:
    container_name: billing-service
    image: api-billing-service:latest
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    ports:
      - 4001:4001
      - 9001:9001
    depends_on:
      - postgres
      - patient-service
    networks:
      - patient-network
    restart: unless-stopped

networks:
  patient-network:
    driver: bridge

volumes:
  postgres:
    driver: local